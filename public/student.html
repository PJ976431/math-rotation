<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>《旋转》课堂活动 - 学生端</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .star-tool-wrap { display: flex; flex-direction: column; gap: 14px; }
    .star-header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 12px 14px; border-radius: 16px; background: rgba(255,255,255,0.84); box-shadow: 0 8px 24px rgba(0,0,0,0.06); border: 1px solid rgba(120, 160, 180, 0.18); }
    .star-logo { width: 120px; height: 120px; border-radius: 14px; overflow: hidden; background: linear-gradient(135deg, #f5fbff, #eaf6ff); box-shadow: 0 0 20px rgba(136, 199, 255, 0.18); flex: 0 0 auto; border: 1px solid rgba(120, 160, 180, 0.15); display: flex; align-items: center; justify-content: center; color: #4a7282; font-weight: 900; font-size: 18px; }
    .star-logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .star-title-box h2 { margin: 0; font-size: 26px; color: #395a66; }
    .star-title-box p { margin: 6px 0 0; color: #5f7480; line-height: 1.7; font-size: 14px; }
    .star-board { position: relative; width: 100%; min-height: 560px; border-radius: 18px; overflow: hidden; background: #f8fbff; box-shadow: 0 16px 40px rgba(70, 100, 120, 0.10); border: 1px solid #dce8ef; }
    .star-canvas { width: 100%; height: 560px; display: block; cursor: crosshair; touch-action: none; user-select: none; -webkit-user-select: none; }
    .star-tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .star-tools .btn { min-width: 140px; }
    .star-status { padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,0.86); color: #334155; font-size: 14px; line-height: 1.8; border: 1px solid rgba(120, 160, 180, 0.16); }
    .star-msg { margin-top: 10px; color: #b91c1c; font-size: 14px; }
    .hidden { display: none !important; }
    .activity3-nav-bottom { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
    .board-tip { font-size: 13px; color: #5f7480; margin-top: 8px; }
    .activity3-page-header { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
    .center-box { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .center-box label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
    .activity2-step-box { margin-top: 14px; padding: 14px 16px; border-radius: 16px; background: rgba(255,255,255,0.86); border: 1px solid rgba(120, 160, 180, 0.16); box-shadow: 0 8px 24px rgba(0,0,0,0.05); }
    .activity2-step-box h3 { margin: 0 0 10px; font-size: 18px; color: #395a66; }
    .activity2-step-box p { margin: 0; line-height: 1.8; color: #334155; font-size: 14px; }
    .activity2-grid-wrap { margin-top: 12px; padding: 12px; border-radius: 14px; background: #f8fbff; border: 1px solid #dce8ef; }
    .activity2-grid-canvas { width: 100%; height: 420px; display: block; border-radius: 12px; background: #fff; border: 1px solid #dce8ef; touch-action: none; user-select: none; -webkit-user-select: none; }
    
    /* 画笔工具激活状态 */
    .btn.tool-active {
      background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%) !important;
      box-shadow: 0 4px 0 #1d4ed8 !important;
      transform: translateY(2px);
    }
  </style>
</head>
<body class="theme-bg">
  <div class="page-shell">
    <div class="top-banner">
      <h1>《旋转》课堂活动</h1>
      <p id="welcome"></p>
      <button id="logoutBtn" class="btn small" style="margin-top:10px;">退出登录</button>
    </div>

    <div class="card">
      <div class="tabs">
        <button class="tab-btn active" data-activity="1">任务一</button>
        <button class="tab-btn" data-activity="2">任务二</button>
        <button class="tab-btn" data-activity="3">任务三</button>
        <button class="tab-btn" data-activity="4">综合练习</button>
      </div>

      <!-- 任务一 -->
      <div id="activity1Panel" class="activity-panel">
        <div class="activity-heading">任务要求：画出旋转后的线段AB。</div>
        <div class="activity2-grid-wrap">
          <canvas id="activity1Canvas" class="activity2-grid-canvas"></canvas>
        </div>
        <div class="star-tools" style="margin-top:12px;">
          <button id="a1PenBtn" class="btn">画笔</button>
          <button id="a1EraserBtn" class="btn">橡皮擦</button>
          <button id="a1ResetBtn" class="btn">重置画布</button>
        </div>
        <div class="button-row" style="margin-top: 16px;">
          <button id="submitBtn" class="btn primary">提交作品</button>
        </div>
      </div>

      <!-- 任务二 -->
      <div id="activity2Panel" class="activity-panel hidden">
        <div class="task-card large-task-card">
          <div class="activity-heading" style="margin-bottom: 15px;">
            任务要求：1.旋转线段AB点亮3颗星星。2.和同桌说一说如何旋转。
          </div>
          <div class="activity2-step-box">
            <h3>旋转线段AB</h3>
            <div class="activity2-grid-wrap">
              <canvas id="activity2Canvas" class="activity2-grid-canvas"></canvas>
            </div>
            <div class="star-tools" style="margin-top:12px;">
              <button id="a2ModeLineBtn" class="btn">操纵线段AB</button>
              <button id="a2ResetBtn" class="btn">重置</button>
            </div>
            <div class="star-tools center-box" id="a2CenterBox" style="margin-top:12px;">
              <label><input type="radio" name="a2CenterChoice" value="A" checked> 以A点为旋转中心</label>
              <label><input type="radio" name="a2CenterChoice" value="B"> 以B点为旋转中心</label>
            </div>
          </div>
        </div>
      </div>

      <!-- 任务三 -->
      <div id="activity3Panel" class="activity-panel hidden">
        <div class="task-card large-task-card">
          <div class="star-tool-wrap">
            <div class="activity3-page-header">
              <div class="activity-heading" style="margin-bottom:0; flex: 1 1 auto;" id="activity3Title">
                任务要求：想一想5颗星星还能放在哪些位置通过旋转一次线段AB都能点亮？
              </div>
            </div>
            <div class="star-tools">
              <button id="modeStarBtn" class="btn primary">放置/拖动星星</button>
              <button id="modeLineBtn" class="btn">操纵线段 AB</button>
              <button id="clearTrailBtn" class="btn">清除轨迹</button>
              <button id="resetBtn" class="btn">重置</button>
            </div>
            <div class="star-tools center-box" id="activity3CenterBox">
              <label><input type="radio" name="centerChoice" value="A" checked> 以A点为旋转中心</label>
              <label><input type="radio" name="centerChoice" value="B"> 以B点为旋转中心</label>
            </div>
            <div class="star-tools hidden" id="activity3Page2Tools">
              <button id="addOBtn" class="btn">添加点 O</button>
              <button id="autoRunBtn" class="btn">自动演示旋转一周</button>
              <label id="oCenterWrap" class="hidden"><input type="radio" name="centerChoice" value="O"> 以O点为旋转中心</label>
            </div>
            <div class="star-tools">
              <!-- 【修改④】修改轨迹文案 -->
              <label><input type="checkbox" id="trailA"> A'点轨迹</label>
              <label><input type="checkbox" id="trailB"> B'点轨迹</label>
            </div>
            <div class="star-board">
              <canvas id="starCanvas" class="star-canvas"></canvas>
            </div>
            <div class="button-row" style="justify-content: space-between; align-items: center;">
              <button id="submitStarBtn" class="btn primary">提交</button>
              <div class="activity3-nav-bottom">
                <button id="activity3PrevBtn" class="btn hidden">上一页</button>
                <button id="activity3NextBtn" class="btn">下一页</button>
              </div>
            </div>
            <div id="starMsg" class="msg star-msg"></div>
          </div>
        </div>
      </div>

      <!-- 综合练习 -->
      <div id="activity4Panel" class="activity-panel hidden">
        <div class="task-card large-task-card">
          <div class="activity-heading" id="a4TaskText">任务要求：画出线段MN绕点P顺时针旋转90°后的图形。</div>
          <div class="activity2-grid-wrap">
            <canvas id="activity4Canvas" class="activity2-grid-canvas"></canvas>
          </div>
          <div class="star-tools" style="margin-top:12px;">
            <button id="a4PenBtn" class="btn">画笔</button>
            <button id="a4EraserBtn" class="btn">橡皮擦</button>
            <button id="a4ResetBtn" class="btn">重置画布</button>
          </div>
          <div class="button-row" style="justify-content: space-between; align-items: center; margin-top: 16px;">
            <button id="a4SubmitBtn" class="btn primary">提交本页练习</button>
            <div class="activity3-nav-bottom">
              <button id="a4PrevBtn" class="btn hidden">上一页</button>
              <button id="a4NextBtn" class="btn">下一页</button>
            </div>
          </div>
          <div id="a4Msg" class="msg" style="text-align: center; margin-top: 10px;"></div>
        </div>
      </div>

      <div id="msg" class="msg"></div>
    </div>
  </div>
  <script src="/js/student.js"></script>
</body>
</html>
