<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>《旋转》课堂活动 - 教师端</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    /* 紧凑化全局样式，确保一屏显示 */
    .page-shell { padding: 16px; }
    .top-banner { padding: 16px; margin-bottom: 16px; border-radius: 24px; }
    .top-banner h1 { font-size: 28px; letter-spacing: 2px; }
    .top-banner p { font-size: 14px; margin-top: 4px; }
    .card { padding: 16px; border-radius: 24px; }
    .tabs { margin-bottom: 12px; gap: 8px; }
    .tab-btn, .btn { padding: 10px 20px; font-size: 16px; }
    .activity-heading { padding: 12px 16px 12px 50px; font-size: 18px; margin-bottom: 12px; border-radius: 16px; }
    .activity-heading::before { font-size: 24px; left: 14px; }

    .activity2-grid-wrap { margin-top: 8px; padding: 8px; border-radius: 12px; background: #f8fbff; border: 1px solid #dce8ef; }
    /* 【修改】画布高度调高至 420px，解决“很扁”的问题，比例更协调 */
    .activity2-grid-canvas { width: 100%; height: 420px; display: block; border-radius: 10px; background: #fff; border: 1px solid #dce8ef; touch-action: none; user-select: none; }
    
    .star-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
    .star-tools .btn { min-width: 120px; }
    .center-box label { font-size: 14px; }
    
    /* 任务二：上下结构，星星横向三等分 */
    .t-a2-container { display: flex; flex-direction: column; gap: 12px; }
    .t-a2-left { width: 100%; } 
    .t-a2-right { 
      width: 100%; 
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      gap: 12px; 
    }
    
    /* 任务三画布样式 */
    .t-a3-board { position: relative; width: 100%; min-height: 450px; border-radius: 14px; overflow: hidden; background: #f8fbff; border: 1px solid #dce8ef; margin-top: 12px; }
    .t-a3-canvas { width: 100%; height: 450px; display: block; cursor: crosshair; touch-action: none; user-select: none; }

    /* ===================== 任务二：星星与文字交互样式 ===================== */
    /* 【修改】去除外层容器的背景、边框和阴影，使其完全透明 */
    .star-hint-item {
      display: flex; flex-direction: row; align-items: center; gap: 10px;
      cursor: pointer; padding: 10px; border-radius: 16px; transition: all 0.2s;
      background: transparent; 
      border: 2px solid transparent; 
    }
    .star-hint-item:hover { 
      background: transparent; 
      border-color: transparent; 
      transform: none; 
    }
    
    .star-icon { 
      font-size: 42px !important; line-height: 1; 
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); 
      cursor: pointer; user-select: none; flex-shrink: 0; 
    }
    .star-icon.active { transform: scale(1.2) rotate(25deg); }

    /* 点击后弹出的文字框保留样式 */
    .star-hint-text { 
      display: none !important; 
      padding: 8px 12px; background: #fffbeb; border: 2px dashed #fbbf24; 
      border-radius: 12px; font-weight: 800; font-size: 16px !important; 
      line-height: 1.5; box-shadow: 0 4px 0 #fde68a; flex: 1;
      white-space: nowrap; 
    }
    .star-hint-text.multi-line {
      white-space: normal;
      font-size: 14px !important;
      line-height: 1.4;
    }

    .star-hint-text.show { 
      display: block !important; 
      animation: fadeInRight 0.3s ease-out; 
    }
    @keyframes fadeInRight {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* 文字颜色区分 */
    .t-black { color: #1e293b; }
    .t-purple { color: #9333ea; font-weight: 900; }
    .t-blue { color: #1d4ed8; font-weight: 900; }
    .t-red { color: #dc2626; font-weight: 900; font-size: 18px; }
  </style>
</head>
<body class="theme-bg">
  <div class="page-shell">
    <div class="top-banner">
      <h1>《旋转》课堂活动 - 教师端</h1>
      <p id="welcome"></p>
      <button id="logoutBtn" class="btn small" style="margin-top:8px;">退出登录</button>
    </div>

    <div class="card">
      <div class="tabs">
        <button class="tab-btn active" data-activity="1">任务一</button>
        <button class="tab-btn" data-activity="2">任务二</button>
        <button class="tab-btn" data-activity="3">任务三</button>
        <button class="tab-btn" data-activity="4">综合练习</button>
      </div>

      <div class="action-row">
        <!-- 这两个按钮在任务二中会被 JS 隐藏 -->
        <button id="refreshBtn" class="btn">刷新作品</button>
        <button id="toggleA3CanvasBtn" class="btn primary" style="display:none;">学生画布</button>
        <button id="clearBtn" class="btn danger">清空当前活动作品</button>
      </div>

      <!-- 任务二专属演示面板 -->
      <div id="teacherActivity2Panel" style="display:none; margin-top: 12px;">
        <div class="task-card large-task-card" style="background: #fff; border: 2px solid #e2e8f0; border-radius: 20px; padding: 16px; box-shadow: 0 4px 0 #f1f5f9;">
          <div class="activity-heading">任务要求：1.旋转线段AB点亮3颗星星。2.和同桌说一说如何旋转。</div>
          
          <div class="t-a2-container">
            <!-- 上方：画布与控制 -->
            <div class="t-a2-left">
              <div class="activity2-grid-wrap" style="margin-top:0;">
                <canvas id="teacherA2Canvas" class="activity2-grid-canvas"></canvas>
              </div>
              <div class="star-tools">
                <button id="tA2ModeLineBtn" class="btn">操纵线段AB</button>
                <button id="tA2ClearTrailBtn" class="btn">清除轨迹</button>
                <button id="tA2AutoRunBtn" class="btn primary">自动旋转一周</button>
                <button id="tA2ResetBtn" class="btn">重置</button>
              </div>
              <div class="star-tools center-box">
                <label><input type="radio" name="tA2CenterChoice" value="A" checked> 以A点为旋转中心</label>
                <label><input type="radio" name="tA2CenterChoice" value="B"> 以B点为旋转中心</label>
                <label style="margin-left: 12px;"><input type="checkbox" id="tA2TrailA" checked> A点轨迹</label>
                <label><input type="checkbox" id="tA2TrailB" checked> B点轨迹</label>
              </div>
            </div>

            <!-- 下方：星星提示 (横向三等分，去除了外框) -->
            <div class="t-a2-right">
              <div class="star-hint-item" data-star="blue">
                <div class="star-icon" style="color: #3b82f6; text-shadow: 0 4px 8px rgba(59, 130, 246, 0.4);">★</div>
                <div class="star-hint-text" id="hintBlue">
                  <span class="t-black">线段AB</span><span class="t-purple">绕点A</span><span class="t-blue">顺时针</span><span class="t-black">旋转</span><span class="t-red">90°</span>
                </div>
              </div>
              <div class="star-hint-item" data-star="green">
                <div class="star-icon" style="color: #22c55e; text-shadow: 0 4px 8px rgba(34, 197, 94, 0.4);">★</div>
                <div class="star-hint-text" id="hintGreen">
                  <span class="t-black">线段AB</span><span class="t-purple">绕点B</span><span class="t-blue">顺时针</span><span class="t-black">旋转</span><span class="t-red">90°</span>
                </div>
              </div>
              <div class="star-hint-item" data-star="purple">
                <div class="star-icon" style="color: #a855f7; text-shadow: 0 4px 8px rgba(168, 85, 247, 0.4);">★</div>
                <div class="star-hint-text multi-line" id="hintPurple">
                  <div><span class="t-black">线段AB</span><span class="t-purple">绕点A</span><span class="t-blue">顺时针</span><span class="t-black">旋转</span><span class="t-red">180°</span></div>
                  <div style="margin-top: 4px;"><span class="t-black">线段AB</span><span class="t-purple">绕点A</span><span class="t-blue">逆时针</span><span class="t-black">旋转</span><span class="t-red">180°</span></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 任务三专属演示面板 (学生画布) -->
      <div id="teacherActivity3Panel" style="display:none; margin-top: 12px;">
        <div class="task-card large-task-card" style="background: #fff; border: 2px solid #e2e8f0; border-radius: 20px; padding: 16px; box-shadow: 0 4px 0 #f1f5f9;">
          <div class="activity-heading">任务要求：想一想5颗星星还能放在哪些位置通过旋转一次线段AB都能点亮？</div>
          <div class="star-tools">
            <button id="tA3ModeStarBtn" class="btn primary">放置/拖动星星</button>
            <button id="tA3ModeLineBtn" class="btn">操纵线段 AB</button>
            <button id="tA3ClearTrailBtn" class="btn">清除轨迹</button>
            <button id="tA3AutoRunBtn" class="btn primary">自动旋转一周</button>
            <button id="tA3ResetBtn" class="btn">重置</button>
          </div>
          <div class="star-tools center-box">
            <label><input type="radio" name="tA3CenterChoice" value="A" checked> 以A点为旋转中心</label>
            <label><input type="radio" name="tA3CenterChoice" value="B"> 以B点为旋转中心</label>
          </div>
          <div class="star-tools" id="tA3Page2Tools" style="display:none;">
            <button id="tA3AddOBtn" class="btn">添加点 O</button>
            <label id="tA3OCenterWrap" style="display:none;"><input type="radio" name="tA3CenterChoice" value="O"> 以O点为旋转中心</label>
          </div>
          <div class="star-tools">
            <label><input type="checkbox" id="tA3TrailA"> A点轨迹</label>
            <label><input type="checkbox" id="tA3TrailB"> B点轨迹</label>
            <label><input type="checkbox" id="tA3TrailSeg"> 线段轨迹</label>
          </div>
          <div class="t-a3-board">
            <canvas id="teacherA3Canvas" class="t-a3-canvas"></canvas>
          </div>
          <div class="button-row" style="justify-content: flex-end; margin-top: 12px;">
            <button id="tA3PrevBtn" class="btn" style="display:none;">上一页</button>
            <button id="tA3NextBtn" class="btn">下一页</button>
          </div>
          <div id="tA3Msg" class="msg" style="text-align:center; margin-top:10px;"></div>
        </div>
      </div>

      <!-- 任务三作品提交状态区 -->
      <div id="submissionWrapper" style="margin-top: 12px; padding: 12px; border-radius: 14px; background: #fff7ed; border: 1px solid #fed7aa; display: none;">
        <h3 style="margin:0 0 8px;">任务三：学生提交状态与截图</h3>
        <div id="submissionBox" style="font-size:14px; line-height:1.7; color:#334155;">暂无提交</div>
      </div>

      <!-- 作品列表容器 (在任务二中会被 JS 隐藏) -->
      <div id="works" class="works-list" style="margin-top:16px;"></div>
      <div id="msg" class="msg"></div>
    </div>
  </div>

  <script src="/js/teacher.js"></script>
</body>
</html>
