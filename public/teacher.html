<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>《旋转》课堂活动 - 教师端</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .page-shell { padding: 16px; }
    .top-banner { padding: 16px; margin-bottom: 16px; border-radius: 24px; }
    .top-banner h1 { font-size: 28px; letter-spacing: 2px; }
    .top-banner p { font-size: 14px; margin-top: 4px; }
    .card { padding: 16px; border-radius: 24px; }
    .tabs { margin-bottom: 12px; gap: 8px; }
    .tab-btn, .btn { padding: 10px 20px; font-size: 16px; }
    .activity-heading { padding: 12px 16px 12px 50px; font-size: 18px; margin-bottom: 12px; border-radius: 16px; }
    .activity-heading::before { font-size: 24px; left: 14px; }
    .activity2-grid-wrap { margin-top: 8px; padding: 8px; border-radius: 12px; background: #f8fbff; border: 1px solid #dce8ef; }
    .activity2-grid-canvas { width: 100%; height: 420px; display: block; border-radius: 10px; background: #fff; border: 1px solid #dce8ef; touch-action: none; user-select: none; }
    .star-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
    .star-tools .btn { min-width: 120px; }
    .center-box label { font-size: 14px; }
    .t-a2-container { display: flex; flex-direction: column; gap: 12px; }
    .t-a2-left { width: 100%; } 
    .t-a2-right { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .t-a3-board, .t-a4-board { position: relative; width: 100%; min-height: 450px; border-radius: 14px; overflow: hidden; background: #f8fbff; border: 1px solid #dce8ef; margin-top: 12px; }
    .t-a3-canvas, .t-a4-canvas { width: 100%; height: 450px; display: block; cursor: crosshair; touch-action: none; user-select: none; }
    .star-hint-item { display: flex; flex-direction: row; align-items: center; gap: 10px; cursor: pointer; padding: 10px; border-radius: 16px; background: transparent; border: 2px solid transparent; }
    .star-icon { font-size: 42px !important; line-height: 1; transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); cursor: pointer; user-select: none; flex-shrink: 0; }
    .star-icon.active { transform: scale(1.2) rotate(25deg); }
    .star-hint-text { display: none !important; padding: 8px 12px; background: #fffbeb; border: 2px dashed #fbbf24; border-radius: 12px; font-weight: 800; font-size: 16px !important; line-height: 1.5; box-shadow: 0 4px 0 #fde68a; flex: 1; white-space: nowrap; }
    .star-hint-text.multi-line { white-space: normal; font-size: 14px !important; line-height: 1.4; }
    .star-hint-text.show { display: block !important; animation: fadeInRight 0.3s ease-out; }
    @keyframes fadeInRight { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
    .t-black { color: #1e293b; } .t-purple { color: #9333ea; font-weight: 900; } .t-blue { color: #1d4ed8; font-weight: 900; } .t-red { color: #dc2626; font-weight: 900; font-size: 18px; }
    .work-section { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 24px; }
    .work-section .section-title { grid-column: 1 / -1; font-size: 24px; font-weight: 900; color: #0369a1; margin: 0 0 8px 0; padding-bottom: 8px; border-bottom: 3px dashed #7dd3fc; }
    .work-card { background: #fff; border: 2px solid #e2e8f0; border-radius: 20px; padding: 16px; box-shadow: 0 4px 0 #f1f5f9; display: flex; flex-direction: column; }
    .work-card .meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: 14px; color: #475569; margin-bottom: 12px; font-weight: 600; }
    .work-card .meta span { background: #f0f9ff; padding: 4px 10px; border-radius: 10px; border: 1px solid #bae6fd; color: #0369a1; }
    .work-card img.work-image { width: 100%; max-height: 260px; object-fit: contain; background: #f8fafc; border-radius: 12px; border: 2px solid #e2e8f0; margin-bottom: 12px; cursor: zoom-in; }
    .work-card .action-row { margin-top: auto; display: flex; justify-content: flex-end; }
    .work-card .btn.danger { background: linear-gradient(135deg, #f87171, #ef4444); color: #fff; border: none; border-radius: 999px; padding: 8px 18px; font-size: 14px; font-weight: 800; cursor: pointer; box-shadow: 0 3px 0 #b91c1c; }
    #submissionBox { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    .lightbox-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.92); display: flex; align-items: center; justify-content: center; z-index: 9999; opacity: 0; visibility: hidden; transition: opacity 0.3s, visibility 0.3s; }
    .lightbox-overlay.active { opacity: 1; visibility: visible; }
    .lightbox-toolbar { position: absolute; top: 20px; right: 20px; z-index: 10002; }
    .lightbox-bottom-toolbar { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 16px; z-index: 10002; background: rgba(0,0,0,0.4); padding: 12px 24px; border-radius: 999px; backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1); }
    .lb-btn { width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3); color: #fff; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .lb-btn:hover { background: rgba(255,255,255,0.3); transform: scale(1.05); }
    .lb-btn.active { background: #3b82f6; border-color: #60a5fa; box-shadow: 0 0 15px #3b82f6; }
    .lb-close-btn { background: rgba(239, 68, 68, 0.8); border-color: #f87171; }
    .lb-close-btn:hover { background: #ef4444; }
    .lightbox-content { max-width: 90%; max-height: 90%; transition: transform 0.1s ease-out; cursor: grab; }
    .lightbox-content:active { cursor: grabbing; }
    .lightbox-content img { max-width: 100%; max-height: 85vh; object-fit: contain; border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); pointer-events: none; }
    #lb-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10001; pointer-events: none; }
    .btn.tool-active { background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%) !important; box-shadow: 0 4px 0 #1d4ed8 !important; transform: translateY(2px); }
  </style>
</head>
<body class="theme-bg">
  <div class="page-shell">
    <div class="top-banner">
      <h1>《旋转》课堂活动 - 教师端</h1>
      <p id="welcome"></p>
      <button id="logoutBtn" class="btn small" style="margin-top:8px;">退出登录</button>
    </div>
    <div class="card">
      <div class="tabs">
        <button class="tab-btn active" data-activity="1">任务一</button>
        <button class="tab-btn" data-activity="2">任务二</button>
        <button class="tab-btn" data-activity="3">任务三</button>
        <button class="tab-btn" data-activity="4">综合练习</button>
      </div>
      <div class="action-row">
        <button id="refreshBtn" class="btn">刷新作品</button>
        <button id="toggleA3CanvasBtn" class="btn primary" style="display:none;">学生画布</button>
        <button id="toggleA4CanvasBtn" class="btn primary" style="display:none;">学生画布</button>
        <button id="clearBtn" class="btn danger">清空当前作品</button>
      </div>

      <div id="teacherActivity2Panel" style="display:none; margin-top: 12px;">
        <div class="task-card large-task-card" style="background: #fff; border: 2px solid #e2e8f0; border-radius: 20px; padding: 16px; box-shadow: 0 4px 0 #f1f5f9;">
          <div class="activity-heading">任务要求：1.旋转线段AB点亮3颗星星。2.和同桌说一说如何旋转。</div>
          <div class="t-a2-container">
            <div class="t-a2-left">
              <div class="activity2-grid-wrap" style="margin-top:0;"><canvas id="teacherA2Canvas" class="activity2-grid-canvas"></canvas></div>
              <div class="star-tools">
                <button id="tA2ModeLineBtn" class="btn">操纵线段AB</button>
                <button id="tA2ClearTrailBtn" class="btn">清除轨迹</button>
                <button id="tA2AutoRunBtn" class="btn primary">自动旋转一周</button>
                <button id="tA2ResetBtn" class="btn">重置</button>
              </div>
              <div class="star-tools center-box">
                <label><input type="radio" name="tA2CenterChoice" value="A" checked> 以A点为旋转中心</label>
                <label><input type="radio" name="tA2CenterChoice" value="B"> 以B点为旋转中心</label>
                <label style="margin-left: 12px;"><input type="checkbox" id="tA2TrailA" checked> A'点轨迹</label>
                <label><input type="checkbox" id="tA2TrailB" checked> B'点轨迹</label>
              </div>
            </div>
            <div class="t-a2-right">
              <div class="star-hint-item" data-star="blue"><div class="star-icon" style="color: #3b82f6; text-shadow: 0 4px 8px rgba(59, 130, 246, 0.4);">★</div><div class="star-hint-text" id="hintBlue"><span class="t-black">线段AB</span><span class="t-purple">绕点A</span><span class="t-blue">顺时针方向</span><span class="t-black">旋转了</span><span class="t-red">90°</span></div></div>
              <div class="star-hint-item" data-star="green"><div class="star-icon" style="color: #22c55e; text-shadow: 0 4px 8px rgba(34, 197, 94, 0.4);">★</div><div class="star-hint-text" id="hintGreen"><span class="t-black">线段AB</span><span class="t-purple">绕点B</span><span class="t-blue">顺时针方向</span><span class="t-black">旋转了</span><span class="t-red">90°</span></div></div>
              <div class="star-hint-item" data-star="purple"><div class="star-icon" style="color: #a855f7; text-shadow: 0 4px 8px rgba(168, 85, 247, 0.4);">★</div><div class="star-hint-text multi-line" id="hintPurple"><div><span class="t-black">线段AB</span><span class="t-purple">绕点A</span><span class="t-blue">顺时针方向</span><span class="t-black">旋转了</span><span class="t-red">180°</span></div><div style="margin-top: 4px;"><span class="t-black">线段AB</span><span class="t-purple">绕点A</span><span class="t-blue">逆时针方向</span><span class="t-black">旋转了</span><span class="t-red">180°</span></div></div></div>
            </div>
          </div>
        </div>
      </div>

      <div id="teacherActivity3Panel" style="display:none; margin-top: 12px;">
        <div class="task-card large-task-card" style="background: #fff; border: 2px solid #e2e8f0; border-radius: 20px; padding: 16px; box-shadow: 0 4px 0 #f1f5f9;">
          <div class="activity-heading">任务要求：想一想5颗星星还能放在哪些位置通过旋转一次线段AB都能点亮？</div>
          <div class="star-tools">
            <button id="tA3ModeStarBtn" class="btn primary">放置/拖动星星</button>
            <button id="tA3ModeLineBtn" class="btn">操纵线段 AB</button>
            <button id="tA3ClearTrailBtn" class="btn">清除轨迹</button>
            <button id="tA3AutoRunBtn" class="btn primary">自动旋转一周</button>
            <button id="tA3ResetBtn" class="btn">重置</button>
          </div>
          <div class="star-tools center-box">
            <label><input type="radio" name="tA3CenterChoice" value="A" checked> 以A点为旋转中心</label>
            <label><input type="radio" name="tA3CenterChoice" value="B"> 以B点为旋转中心</label>
          </div>
          <div class="star-tools" id="tA3Page2Tools" style="display:none;">
            <button id="tA3AddOBtn" class="btn">添加点 O</button>
            <label id="tA3OCenterWrap" style="display:none;"><input type="radio" name="tA3CenterChoice" value="O"> 以O点为旋转中心</label>
          </div>
          <div class="star-tools">
            <label><input type="checkbox" id="tA3TrailA"> A'点轨迹</label>
            <label><input type="checkbox" id="tA3TrailB"> B'点轨迹</label>
          </div>
          <div class="t-a3-board"><canvas id="teacherA3Canvas" class="t-a3-canvas"></canvas></div>
          <div class="button-row" style="justify-content: flex-end; margin-top: 12px;">
            <button id="tA3PrevBtn" class="btn" style="display:none;">上一页</button>
            <button id="tA3NextBtn" class="btn">下一页</button>
          </div>
          <div id="tA3Msg" class="msg" style="text-align:center; margin-top:10px;"></div>
        </div>
      </div>

      <div id="teacherActivity4Panel" style="display:none; margin-top: 12px;">
        <div class="task-card large-task-card" style="background: #fff; border: 2px solid #e2e8f0; border-radius: 20px; padding: 16px; box-shadow: 0 4px 0 #f1f5f9;">
          <div class="activity-heading" id="tA4TaskText">任务要求：画出线段MN绕点P顺时针方向旋转90°后的图形。</div>
          <div class="activity2-grid-wrap"><canvas id="teacherA4Canvas" class="activity2-grid-canvas"></canvas></div>
          <div class="star-tools" style="margin-top:12px;">
            <button id="tA4PenBtn" class="btn">画笔</button>
            <button id="tA4EraserBtn" class="btn">橡皮擦</button>
            <button id="tA4ResetBtn" class="btn">重置画布</button>
          </div>
          <div class="button-row" style="justify-content: flex-end; margin-top: 12px;">
            <button id="tA4PrevBtn" class="btn" style="display:none;">上一页</button>
            <button id="tA4NextBtn" class="btn">下一页</button>
          </div>
        </div>
      </div>

      <div id="submissionWrapper" style="margin-top: 12px; padding: 12px; border-radius: 14px; background: #fff7ed; border: 1px solid #fed7aa; display: none;">
        <h3 style="margin:0 0 8px;">任务三：学生提交状态与截图</h3>
        <div id="submissionBox" style="font-size:14px; line-height:1.7; color:#334155;">暂无提交</div>
      </div>
      <div id="works" class="works-list" style="margin-top:16px;"></div>
      <div id="msg" class="msg"></div>
    </div>
  </div>

  <div id="lightbox-overlay" class="lightbox-overlay">
    <div class="lightbox-toolbar"><button id="lb-close" class="lb-btn lb-close-btn" title="关闭">✖</button></div>
    <div class="lightbox-bottom-toolbar">
      <button id="lb-pen" class="lb-btn" title="画笔">✏️</button>
      <button id="lb-eraser" class="lb-btn" title="橡皮擦">🧽</button>
      <button id="lb-clear" class="lb-btn" title="清空批注">🗑️</button>
    </div>
    <div class="lightbox-content" id="lb-content"><img id="lb-img" src="" alt="大图" /></div>
    <canvas id="lb-canvas"></canvas>
  </div>
  <script src="/js/teacher.js"></script>
</body>
</html>
